[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agtstu"
version = "0.2.1"
description = "把学习路径当作依赖图来管理的开源学习工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["learning-path", "dependency-graph", "education", "python", "fastapi", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agtstu = "agtstu.cli:main"

[project.urls]
Homepage = "https://github.com/1fish4/agtstu"
Repository = "https://github.com/1fish4/agtstu"
"Bug Tracker" = "https://github.com/1fish4/agtstu/issues"

[tool.setuptools.packages.find]
include = ["agtstu*"]

[tool.setuptools.package-data]
agtstu = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
